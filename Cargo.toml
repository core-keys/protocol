[package]
name = "corekeys-protocol"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Shared no_std core: CKVP framing, pairing SAS, and co-auth record types"

[dependencies]
sha2 = { version = "0.10", default-features = false }
minicbor = { version = "0.24", default-features = false, features = ["derive", "alloc"] }

[features]
default = []
std = []
